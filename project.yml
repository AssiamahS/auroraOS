name: Aurora
options:
  bundleIdPrefix: com.assiamah
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: QGMAWHX827
    MARKETING_VERSION: 1.0.12
    CURRENT_PROJECT_VERSION: 1
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: Aurora
      - path: Shared
    dependencies:
      - target: AuroraWidgets
      - target: AuroraWatch
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.aurora
      INFOPLIST_FILE: Aurora/Resources/Info.plist
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: 1
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SUPPORTS_XR_DESIGNED_FOR: NO
    info:
      path: Aurora/Resources/Info.plist
      properties:
        CFBundleName: Aurora
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: "Aurora uses your location to track your position along the subway line and count down the stops to your destination."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Background location lets Aurora keep counting stops and alert you when it's time to get off, even with your phone locked."
        UIBackgroundModes:
          - location

  AuroraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AuroraWidgets
      - path: Shared/TripActivityAttributes.swift
      - path: Shared/RouteStyle.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.aurora.widgets
      CODE_SIGN_STYLE: Automatic
      SKIP_INSTALL: true
    info:
      path: AuroraWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AuroraWatch:
    type: application
    platform: watchOS
    sources:
      - path: AuroraWatch
      - path: Shared/TripModels.swift
      - path: Shared/RouteStyle.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assiamah.aurora.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AuroraWatch/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.assiamah.aurora
